name: TR-GC-Crypto-LS-23

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes to guard active trailing stops
  workflow_dispatch:

concurrency:
  group: crypto-trading-bot-engine
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_SECRET_KEY: ${{ secrets.HL_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python bot_engine.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add state.json
          git commit -m "Auto-update bot state and telemetry [skip ci]" || exit 0
          
          for i in {1..3}; do
            git pull origin main --rebase && git push origin main && break
            echo "Push failed due to concurrent run, retrying..."
            git rebase --abort || true
            sleep 3
          done

name: TR-GC-Crypto-LS-23

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

concurrency:
  group: crypto-trading-bot-engine
  # false = a new run waits for the current one to finish instead of killing it mid-trade
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_SECRET_KEY: ${{ secrets.HL_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python bot_engine.py

      - name: Auto-commit State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "Auto-update bot state and telemetry [skip ci]"
          # The stock bot pushes to main at the same times; pull its commit in and retry instead of failing.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i rejected, retrying..."; sleep $((i * 3))
          done
          exit 1

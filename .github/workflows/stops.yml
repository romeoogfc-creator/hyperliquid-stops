name: TR-GC-Crypto-LS-23

on:
  schedule:
    # Backup only: the external cron (repository_dispatch "trigger-bot") runs the bot every 5 minutes.
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

concurrency:
  group: crypto-trading-bot-engine
  # false = a new run waits for the current one to finish instead of killing it mid-trade
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Most runs take seconds; the first run after the 00:00 UTC daily close downloads ~120 coins (paced, ~3-4 min).
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Always start from the LATEST main (with the newest state.json). Without this, a run that was queued
          # behind another one checks out the older commit and works from an out-of-date state.json.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          # ============================================================================
          # "true"  = DRY RUN: reads your real account, emails what it WOULD do, sends no orders.
          # "false" = LIVE: real orders with real money. Change only after the dry run looks right.
          DRY_RUN: "true"
          # ============================================================================
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_SECRET_KEY: ${{ secrets.HL_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python bot_engine.py

      - name: Auto-commit State Updates
        if: always()
        run: |
          [ -f state.json ] || { echo "No state file"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state.json is written only by this bot and this run's copy is the newest, so never merge it:
          # put it on top of the latest main and push. Retries only if someone pushed in the same instant.
          cp state.json "$RUNNER_TEMP/state.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            git add state.json
            if git diff --staged --quiet; then echo "No state changes"; exit 0; fi
            git commit -q -m "Auto-update bot state and telemetry [skip ci]"
            if git push -q origin HEAD:main; then echo "State saved (attempt $i)"; exit 0; fi
            echo "Push attempt $i rejected, retrying..."; sleep $((i * 3))
          done
          exit 1

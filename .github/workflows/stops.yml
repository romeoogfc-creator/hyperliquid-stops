name: TR-GC-Crypto-LS-23 15M Engine

on:
  schedule:
    - cron: '*/15 * * * *'    # Native 15-minute scan cadence
  repository_dispatch:
    types: [trigger-bot]    # Listens for cron-job.org webhook trigger
  workflow_dispatch:

concurrency:
  group: crypto-trading-bot-engine
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_SECRET_KEY: ${{ secrets.HL_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python bot_engine.py

      - name: Auto-commit State Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update bot state and telemetry [skip ci]"
          file_pattern: "state.json"
          skip_dirty_check: false
          git_pull_args: "--rebase --autostash"

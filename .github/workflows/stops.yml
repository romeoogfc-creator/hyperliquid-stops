name: TR-GC-Crypto-LS-23

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

concurrency:
  group: crypto-trading-bot-engine
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          HL_ACCOUNT_ADDRESS: ${{ secrets.HL_ACCOUNT_ADDRESS }}
          HL_SECRET_KEY: ${{ secrets.HL_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python bot_engine.py

      - name: Auto-commit State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git stash
          git rebase origin/main
          git stash pop || true
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bot state and telemetry [skip ci]" && git push origin HEAD:main)

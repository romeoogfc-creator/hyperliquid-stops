name: TR-GC-Equities-LS-01

on:
  schedule:
    # Every 5 min, Mon-Fri, 13:00-20:55 UTC. Covers 8:30 AM-3:00 PM CT both in summer (CDT, UTC-5)
    # and after clocks fall back on Nov 1 (CST, UTC-6). Runs outside market hours exit in seconds.
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-trading-bot-engine
  # false = a new run waits for the current one to finish instead of killing it mid-trade
  cancel-in-progress: false

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stock Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          APAL_API_KEY_ID: ${{ secrets.APAL_API_KEY_ID }}
          APAL_SECRET_KEY: ${{ secrets.APAL_SECRET_KEY }}
          APAL_BASE_URL: ${{ secrets.APAL_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python bot_engine_stocks.py

      - name: Auto-commit State Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stock_state.json is written only by this bot and this run's copy is the newest, so never merge it:
          # put it on top of the latest main and push. Retries only if someone pushed in the same instant.
          cp stock_state.json "$RUNNER_TEMP/stock_state.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/stock_state.json" stock_state.json
            git add stock_state.json
            if git diff --staged --quiet; then echo "No state changes"; exit 0; fi
            git commit -q -m "Auto-update stock bot state and telemetry [skip ci]"
            if git push -q origin HEAD:main; then echo "State saved (attempt $i)"; exit 0; fi
            echo "Push attempt $i rejected, retrying..."; sleep $((i * 3))
          done
          exit 1

name: TR-GC-Equities-LS-01

on:
  schedule:
    # Runs every 30 minutes Monday-Friday during active US Market hours (8 AM - 2 PM CT / 13:00 - 19:00 UTC)
    - cron: '*/30 13-19 * * 1-5'
    # Dedicated pre-close square-off trigger at 2:50 PM CT (19:50 UTC)
    - cron: '50 19 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stock Trading Engine
        env:
          APAL_API_KEY_ID: ${{ secrets.APAL_API_KEY_ID }}
          APAL_SECRET_KEY: ${{ secrets.APAL_SECRET_KEY }}
          APAL_BASE_URL: ${{ secrets.APAL_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python bot_engine_stocks.py

      - name: Commit state changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git stash
          git pull origin main --rebase
          git stash pop || true
          git add stock_state.json
          git commit -m "Auto-update stock bot state and telemetry [skip ci]" || exit 0
          git push origin main

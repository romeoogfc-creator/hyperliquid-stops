name: TR-GC-Equities-LS-01

on:
  schedule:
    # Runs every 5 minutes Monday-Friday during active US Market hours (8 AM - 3 PM CT / 13:00 - 19:55 UTC)
    - cron: '*/5 13-19 * * 1-5'
    # Dedicated pre-close square-off trigger at 2:40 PM CT (19:40 UTC)
    - cron: '40 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-trading-bot-engine
  cancel-in-progress: true

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Stock Trading Engine
        env:
          PYTHONUNBUFFERED: "1"
          APAL_API_KEY_ID: ${{ secrets.APAL_API_KEY_ID }}
          APAL_SECRET_KEY: ${{ secrets.APAL_SECRET_KEY }}
          APAL_BASE_URL: ${{ secrets.APAL_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python bot_engine_stocks.py

      - name: Auto-commit State Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stock bot state and telemetry [skip ci]"
          file_pattern: "stock_state.json"
          skip_dirty_check: false
          git_pull_args: "--rebase --autostash"
